services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bhoomi_postgis
    environment:
      POSTGRES_DB: bhoomi_land_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomi_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/bhoomi_land_records
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_DEV_LOGIN: "${VITE_ENABLE_DEV_LOGIN:-false}"
    container_name: bhoomi_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
